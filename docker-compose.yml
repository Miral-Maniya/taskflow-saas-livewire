version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taskflow_app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    ports:
      - "8000:8000"

    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8

    container_name: taskflow_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

  redis:
    image: redis:alpine

    container_name: taskflow_redis

    ports:
      - "6379:6379"